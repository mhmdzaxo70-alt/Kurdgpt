<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KurdGPT</title>
<style>
  body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
  h1 { font-size: 40px; color: #00d26a; margin-top: 30px; }
  p { font-size: 18px; color: #ccc; }
  #chat-box { width: 100%; max-width: 400px; height: 350px; background: #1e1e1e; margin: 20px auto; border-radius: 10px; padding: 10px; overflow-y: auto; text-align: right; display: none; }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; display: inline-block; max-width: 80%; word-break: break-word; }
  .user { background: #00d26a; color: black; float: right; clear: both; }
  .bot { background: #333; color: white; float: left; clear: both; }
  #input-container { display: none; max-width: 400px; margin: 0 auto; }
  input { width: 68%; padding: 10px; border-radius: 5px; border: none; }
  button { padding: 10px 18px; font-size: 16px; border: none; border-radius: 8px; background: #00d26a; color: black; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<div>
  <h1>KurdGPT</h1>
  <p id="sub-title">ئێکەم ژیریا دەستكردا كوردی</p>
  <button id="start-btn" onclick="startChat()">گفتوگۆێ بكه</button>
</div>

<div id="chat-box"></div>
<div id="input-container">
  <input type="text" id="user-input" placeholder="تشتەكێ بنڤێسه...">
  <button onclick="sendMsg()">هنارتن</button>
</div>

<script>
  const API_KEY = "AQ.Ab8RN6LqZfYu02OnRjgVRVwf-Qr6eWdrnsRLzFRNI04Mh5mbjg";

  function startChat() {
    document.getElementById('start-btn').style.display = 'none';
    document.getElementById('sub-title').style.display = 'none';
    document.getElementById('chat-box').style.display = 'block';
    document.getElementById('input-container').style.display = 'block';
    addMsg('سلاڤ! ئه‌ز KurdGPT م، چه‌وا دكارم هاريكاريا ته بكه‌م؟', 'bot');
  }

  function addMsg(text, sender) {
    let box = document.getElementById('chat-box');
    let div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.innerText = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  async function sendMsg() {
    let input = document.getElementById('user-input');
    let userText = input.value.trim();
    if(!userText) return;

    addMsg(userText, 'user');
    input.value = '';

    addMsg('چايەکێ ڤەخۆ... ئه ز يێ بەرسڤێ ئامادە دکەم...', 'bot');

    try {
      let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: "You are a helpful assistant. Reply in Kurdish (Badini/Kurmanji) dialect: " + userText }] }]
        })
      });
      
      let data = await response.json();
      let reply = data.candidates[0].content.parts[0].text;

      let box = document.getElementById('chat-box');
      box.removeChild(box.lastChild);
      addMsg(reply, 'bot');
    } catch (e) {
      let box = document.getElementById('chat-box');
      box.removeChild(box.lastChild);
      addMsg('گەشەپێدەر: خەلەتیەک چێبوو! تكايە API Key بپشكنه.', 'bot');
    }
  }
</script>

</body>
</html>
